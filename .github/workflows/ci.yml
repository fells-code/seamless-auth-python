name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 resolves Django 5.2 LTS, 3.12 and later the current Django.
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  # The adapter conformance suite from seamless-cli, against each reference app in
  # conformance/: the same specs the Express, Fastify, Go and Rust adapters pass.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [fastapi, django]
    steps:
      - uses: actions/checkout@v4
        with:
          path: seamless-auth-python
      - uses: actions/checkout@v4
        with:
          repository: fells-code/seamless-auth-api
          path: seamless-auth-api
      - uses: actions/checkout@v4
        with:
          repository: fells-code/seamless-cli
          path: seamless-cli
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the CLI
        working-directory: seamless-cli
        run: npm ci && npm run build
      - name: Start the reference app
        working-directory: seamless-auth-python
        env:
          PORT: '8080'
          AUTH_SERVER_URL: http://localhost:5312
          AUTH_SERVER_ISSUER: http://auth-api:5312
          API_SERVICE_TOKEN: verify-dev-service-token-not-a-real-secret
          COOKIE_SIGNING_KEY: verify-dev-service-token-not-a-real-secret
          JWKS_KID: dev-main
        run: |
          uv sync --locked
          nohup uv run python conformance/${{ matrix.app }}_app.py > refapp.log 2>&1 &
      - name: Conformance
        env:
          SEAMLESS_API_DIR: ${{ github.workspace }}/seamless-auth-api
        run: node seamless-cli/dist/index.js verify --adapter-url=http://localhost:8080
      - name: Reference app log
        if: always()
        run: cat seamless-auth-python/refapp.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results-${{ matrix.app }}
          path: seamless-cli/verify/harness/results/
          if-no-files-found: ignore
