[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "seamless-auth"
version = "0.1.0"
description = "Seamless Auth server adapter for FastAPI and Django: cookie and bearer sessions in front of the Seamless Auth API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Fells Code LLC" }]
keywords = ["auth", "passkeys", "fastapi", "django", "session", "webauthn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    # Upstream calls to the auth API, with streaming for downloads. httpx2 is the
    # maintained continuation of httpx (Pydantic), which Starlette also moved to.
    "httpx2>=2.13,<3",
    # HS256 cookies and service tokens, RS256 verification against the API's JWKS.
    "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115"]
django = ["django>=5.2"]

[project.urls]
Homepage = "https://github.com/fells-code/seamless-auth-python"
Repository = "https://github.com/fells-code/seamless-auth-python"
Issues = "https://github.com/fells-code/seamless-auth-python/issues"
Changelog = "https://github.com/fells-code/seamless-auth-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
    "mypy>=1.18",
    "fastapi>=0.115",
    "django>=5.2",
    "django-stubs>=5.2",
    "uvicorn>=0.32",
]

[tool.hatch.build.targets.sdist]
include = ["src/seamless_auth", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/seamless_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF", "PL", "PT"]
ignore = [
    "PLR0911", # one return per outcome is how the routes read
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "S105",    # cookie names are not passwords
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "PLC0415", "PT018"]
"conformance/**" = ["S104", "S106"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true
